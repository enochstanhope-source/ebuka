<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Project Allocation - Student Portal | Polybay</title>
    <link rel="icon" href="../images/polybay.png" type="image/png" />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/portal.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app-screen">
        <header class="portal-header">
            <a href="../index.html" class="back-button">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>Student Profile</h1>
        </header>

        <div class="profile-editor">
            <div class="profile-photo">
                <img src="../images/nophoto.jpg" alt="Profile Photo" id="profilePhoto">
                <button class="change-photo" id="changePhoto">
                    <i class="fas fa-camera"></i>
                </button>
            </div>

            <form id="profileForm" class="profile-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" value="" placeholder="Full name used to register student email" readonly>
                </div>

                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" name="email" value="" placeholder="student@school.edu" readonly>
                </div>

                <div class="form-group">
                    <label for="regNo">Registration Number</label>
                    <input type="text" id="regNo" name="regNo" value="" placeholder="Student registration number used during registration" readonly>
                    <small class="help-text">This registration number will be used to identify your project allocation and is managed from registration.</small>
                </div>

                <!-- Save button removed: profile fields are managed from registration -->
            </form>
        </div>
    </main>
    <script src="../scripts/firebase-init.js"></script>
    <script src="../scripts/student-portal.js"></script>
</body>
</html>
